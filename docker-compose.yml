services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: prep-tracker-web
    restart: unless-stopped
    networks:
      - prep-tracker-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: prep-tracker-api
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:-3001}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      NODE_ENV: production
    networks:
      - prep-tracker-network

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - prep-tracker-network

networks:
  prep-tracker-network:
    driver: bridge
