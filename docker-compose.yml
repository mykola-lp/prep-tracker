name: prep-tracker-prod

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: prep-tracker-web-prod
    networks:
      - prep-tracker-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - postgres
    environment:
      PORT: ${API_PORT}
      CLIENT_ORIGIN: http://localhost:${NGINX_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
    image: prep-tracker-api-prod
    networks:
      - prep-tracker-network
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    image: postgres:16-alpine
    networks:
      - prep-tracker-network
    restart: unless-stopped
    volumes:
      - ./data/docker/prod/postgres:/var/lib/postgresql/data

  nginx:
    container_name: prep-tracker-prod-reverse-proxy
    depends_on:
      - web
      - api
    image: nginx:1.29-alpine
    networks:
      - prep-tracker-network
    ports:
      - '${NGINX_PORT}:80'
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  prep-tracker-network:
    driver: bridge
