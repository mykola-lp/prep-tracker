name: prep-tracker-dev

services:
  web:
    build:
      context: .
      dockerfile: apps/web/dev.Dockerfile
    image: prep-tracker-web-dev
    volumes:
      - .:/workspace
      - /workspace/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_PROXY_TARGET: ${DEV_VITE_API_PROXY_TARGET}
    ports:
      - '${DEV_WEB_PORT:-5173}:5173'
    networks:
      - prep-tracker-network

  api:
    build:
      context: .
      dockerfile: apps/api/dev.Dockerfile
    image: prep-tracker-api-dev
    volumes:
      - .:/workspace
      - /workspace/node_modules
    environment:
      PORT: ${DEV_API_PORT:-3001}
      CLIENT_ORIGIN: http://localhost:${DEV_NGINX_PORT:-8080}
      DATABASE_URL: ${DEV_DATABASE_URL}
    ports:
      - '${DEV_API_PORT:-3001}:${DEV_API_PORT:-3001}'
    networks:
      - prep-tracker-network

  postgres:
    image: postgres:16-alpine
    profiles:
      - local-db
    ports:
      - '${DEV_POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-prep_tracker_dev}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-prep_tracker_dev}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-prep_tracker_dev}
    volumes:
      - ./data/docker/dev/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - prep-tracker-network

  nginx:
    image: nginx:1.29-alpine
    container_name: prep-tracker-dev-reverse-proxy
    ports:
      - '${DEV_NGINX_PORT:-8080}:80'
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - prep-tracker-network

networks:
  prep-tracker-network:
    driver: bridge
