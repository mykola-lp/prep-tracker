name: prep-tracker-dev

services:
  web:
    build:
      context: .
      dockerfile: apps/web/dev.Dockerfile
    image: prep-tracker-web-dev
    volumes:
      - .:/workspace
      - /workspace/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
    ports:
      - '${WEB_PORT}:5173'
    networks:
      - prep-tracker-network

  api:
    build:
      context: .
      dockerfile: apps/api/dev.Dockerfile
    image: prep-tracker-api-dev
    volumes:
      - .:/workspace
      - /workspace/node_modules
    environment:
      PORT: ${API_PORT}
      CLIENT_ORIGIN: http://localhost:${NGINX_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
    ports:
      - '${API_PORT}:${API_PORT}'
    networks:
      - prep-tracker-network

  postgres:
    image: postgres:16-alpine
    profiles:
      - local-db
    ports:
      - '${DB_PORT}:5432'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/docker/dev/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - prep-tracker-network

  nginx:
    image: nginx:1.29-alpine
    container_name: prep-tracker-dev-reverse-proxy
    ports:
      - '${NGINX_PORT}:80'
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - prep-tracker-network

networks:
  prep-tracker-network:
    driver: bridge
