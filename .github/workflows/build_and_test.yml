name: Build and test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Check style
        run: npm run lint --workspace @prep-tracker/web

      - name: Test unit
        run: |
          npm run test:web
          npm run test:api

      - name: Build
        run: npm run build:web

      - name: Run e2e tests
        run: npm run test:e2e
