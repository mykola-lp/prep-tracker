name: Build and test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://prep_tracker_test:prep_tracker_test@localhost:5432/prep_tracker_test
      JWT_SECRET: super_secret_key_123

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prep_tracker_test
          POSTGRES_PASSWORD: prep_tracker_test
          POSTGRES_DB: prep_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prep_tracker_test -d prep_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Check style
        run: npm run lint --workspace @prep-tracker/web

      - name: Test unit
        run: |
          npm run db:migrate
          npm run test:web
          npm run test:api

      - name: Build
        run: npm run build:web

      - name: Run e2e tests
        run: npm run test:e2e
