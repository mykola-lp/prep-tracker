name: Notify success

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]

jobs:
  notify_success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '#skip') }}

    steps:
      - name: Success notification
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: "🚀 Deployment successful"
          description: |
            A new version has been deployed to production.

            **Repository:** ${{ github.event.workflow_run.head_repository.full_name }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** `${{ github.event.workflow_run.head_sha }}`
            **Message:** ${{ github.event.workflow_run.head_commit.message }}
            **Author:** ${{ github.event.workflow_run.head_commit.author.name }}

            🔗 Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0x57F287
          username: GitHub Actions
